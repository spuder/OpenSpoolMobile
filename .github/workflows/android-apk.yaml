name: OpenSpool Android APK (sideload)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.apk.outputs.name }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # No install scripts: nothing in the build needs them, and this job holds the signing key
      - name: Install Dependencies
        run: npm ci --ignore-scripts

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Decode keystore
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
        run: echo "$ANDROID_KEYSTORE" | base64 --decode > "$RUNNER_TEMP/openspool.keystore"

      # Gradle reads ORG_GRADLE_PROJECT_* env vars as project properties, keeping secrets off the command line
      - name: Build signed release APK
        env:
          ORG_GRADLE_PROJECT_OPENSPOOL_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_OPENSPOOL_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_OPENSPOOL_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          export ORG_GRADLE_PROJECT_OPENSPOOL_UPLOAD_STORE_FILE="$RUNNER_TEMP/openspool.keystore"
          # Tags set versionName/versionCode (v1.4.0 -> 1.4.0 / 10400); manual runs keep build.gradle's fallback
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            export ORG_GRADLE_PROJECT_OPENSPOOL_VERSION="${GITHUB_REF_NAME#v}"
          fi
          cd android
          ./gradlew assembleRelease -PreactNativeArchitectures=armeabi-v7a,arm64-v8a

      - name: Name APK
        id: apk
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then VERSION="$GITHUB_REF_NAME"; else VERSION="${GITHUB_SHA::7}"; fi
          NAME="OpenSpool-${VERSION}.apk"
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk "dist/$NAME"
          (cd dist && sha256sum "$NAME" > "$NAME.sha256")
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: dist/*

  # Separate job so the write token never shares a runner with npm packages or the signing key
  release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.name }}
          path: dist

      - name: Attach to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # Tags with a suffix (v1.4.0-beta1) become prereleases, so releases/latest stays on a stable build
          PRERELEASE=""
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then PRERELEASE="--prerelease"; fi
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes $PRERELEASE
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber
