name: OpenSpool iOS Publisher

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-publish
  cancel-in-progress: false

jobs:
  deploy:
    # Only the upstream repo, and only for v* tags (forks and branches never get here)
    if: github.repository == 'spuder/OpenSpoolMobile' && startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-latest
    # Secrets live in the protected `app-store` environment: v* tags only + required reviewer approval
    environment: app-store
    env:
      LANG: en_US.UTF-8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require tag to be on the default branch
        run: |
          git fetch origin "${{ github.event.repository.default_branch }}"
          if ! git merge-base --is-ancestor "$GITHUB_SHA" "origin/${{ github.event.repository.default_branch }}"; then
            echo "::error::Tag ${GITHUB_REF_NAME} ($GITHUB_SHA) is not on ${{ github.event.repository.default_branch }}; refusing to publish."
            exit 1
          fi

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Ruby (CocoaPods from Gemfile)
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Install Dependencies
        run: |
          npm ci
          cd ios && bundle exec pod install

      # Automatic signing: xcodebuild uses the App Store Connect API key (Admin role) to create/download
      # the distribution certificate and provisioning profile. Secrets are scoped to the steps that need them.
      - name: Write App Store Connect API key
        env:
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
        run: |
          umask 077
          mkdir -p "$RUNNER_TEMP/private_keys"
          printf '%s\n' "$API_KEY_CONTENT" > "$RUNNER_TEMP/private_keys/AuthKey_$API_KEY_ID.p8"
          echo "API_KEY_PATH=$RUNNER_TEMP/private_keys/AuthKey_$API_KEY_ID.p8" >> "$GITHUB_ENV"

      - name: Archive
        env:
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
        run: |
          cd ios
          xcodebuild -workspace OpenSpool.xcworkspace \
            -scheme OpenSpool \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/OpenSpool.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$API_KEY_PATH" \
            -authenticationKeyID "$API_KEY_ID" \
            -authenticationKeyIssuerID "$API_ISSUER_ID" \
            clean archive

      # exportOptions.plist has destination=upload, so this uploads to App Store Connect / TestFlight
      - name: Export and upload to App Store Connect
        env:
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
        run: |
          cd ios
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/OpenSpool.xcarchive" \
            -exportOptionsPlist exportOptions.plist \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$API_KEY_PATH" \
            -authenticationKeyID "$API_KEY_ID" \
            -authenticationKeyIssuerID "$API_ISSUER_ID"

      - name: Remove API key from runner
        if: always()
        run: rm -rf "$RUNNER_TEMP/private_keys"
